[uwsgi]
socket = 0.0.0.0:5001
stats = 0.0.0.0:9001
module = invenio_app.wsgi_rest:application
master = true
die-on-term = true
processes = 2
threads = 2
mount = /api=invenio_app.wsgi_rest:application
manage-script-name = true
wsgi-disable-file-wrapper = true
single-interpreter = true
buffer-size = 65535
pidfile = /tmp/uwsgi_rest.pid
socket-timeout = 180
so-write-timeout = 180
socket-write-timeout = 180
so-send-timeout = 180
socket-send-timeout = 180
# Per-request harakiri (nginx: 60s default API, 180s file upload). Socket
# timeouts stay at 180 for slow upload I/O.
route = ^/api/records/.+/draft/files/.+/content harakiri:180
route-run = harakiri:60