# Scrub SSO broker_token from access-log query strings.
# Note: ALB/CloudWatch access logs (if enabled upstream) may still record the
# full request URI — scrub or disable those separately in AWS.
map $args $args_for_log {
    default $args;
    "~*(.*?)(?:^|&)broker_token=[^&]*&?(.*)" $1$2;
}

log_format main_safe '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri$is_args$args_for_log $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
