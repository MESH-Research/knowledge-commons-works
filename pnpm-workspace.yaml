# Single-package workspace so pnpm 12+ project settings (allowBuilds) live here.
# Root package.json `pnpm.onlyBuiltDependencies` is ignored on pnpm 11+.
packages:
  - "."

allowBuilds:
  "@fortawesome/fontawesome-free": false
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  ejs: false
  es5-ext: false
  fsevents: true

minimumReleaseAgeExclude:
  - qs@6.16.1

strictDepBuilds: false
