name: Container Build
on:
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Trigger on push to main or tags matching v*
  push:
    branches:
      - "dev"
      - "dev/**"
      - "main"
      - "production"
      - "staging"
    tags:
      - release*
  pull_request:
    branches:
      - main
      - production
      - staging
env:
  DOCKER_BUILDKIT: 1
  DOCKERHUB_REGISTRY: docker.io
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: kcworks
  RELEASE_VERSION: unset
jobs:
  build_and_release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # Build + ECR push + ECS services-stable wait can exceed 30m on staging/prod.
    timeout-minutes: 60
    steps:
      - name: Get release version
        id: get_release_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Remove 'release-' prefix if present, otherwise use the full ref name
          release_version=$(echo ${{ github.ref_name }} | sed 's/^release-//')
          echo "Building release version: $release_version"
          echo "RELEASE_VERSION=${release_version}" >> $GITHUB_ENV
        shell: bash
      - name: Label latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "RELEASE_VERSION=latest" >> $GITHUB_ENV
      - name: Label dev
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || contains(github.ref, 'refs/heads/dev/'))
        run: |
          # Convert branch name to valid Docker tag format
          branch_name=${GITHUB_REF#refs/heads/}
          tag_name=${branch_name//\//-}
          echo "RELEASE_VERSION=$tag_name" >> $GITHUB_ENV
      - name: Label production
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/production'
        run: |
          echo "RELEASE_VERSION=production" >> $GITHUB_ENV
          echo "ECR_APP_REPO=${{ env.IMAGE_NAME }}/production" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${{ env.IMAGE_NAME }}/production-frontend" >> $GITHUB_ENV
      - name: Label staging
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
        run: |
          echo "RELEASE_VERSION=staging" >> $GITHUB_ENV
          echo "ECR_APP_REPO=${{ env.IMAGE_NAME }}/staging" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${{ env.IMAGE_NAME }}/staging-frontend" >> $GITHUB_ENV
      - name: Label pull request
        if: github.event_name == 'pull_request'
        run: |
          # For pull requests, use a PR-specific tag format
          pr_number=${{ github.event.number }}
          echo "RELEASE_VERSION=pr-$pr_number" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configure AWS prod credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: env.RELEASE_VERSION == 'production'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: env.RELEASE_VERSION == 'staging'
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        if: env.RELEASE_VERSION == 'production' || env.RELEASE_VERSION == 'staging'
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2
        with:
          mask-password: true
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      # Set up Python 3.12 environment
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.x"
      # Immutable ECR tags from current pyproject version + git SHA (no version bump).
      - name: Set deploy image tags
        if: env.RELEASE_VERSION == 'production' || env.RELEASE_VERSION == 'staging'
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TAG="v${VERSION}-${SHORT_SHA}"
          echo "PROJECT_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ECR_SHA_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ECR_BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=${BUILD_TAG}" >> "$GITHUB_ENV"
          echo "Deploy tags: latest, ${GITHUB_SHA}, ${BUILD_TAG}"
      # Cache docker images so they don't rebuild every time
      # - name: Cache Local Images
      #   id: local-images
      #   uses: actions/cache@v3
      #   with:
      #     path: /var/lib/docker/
      #     key: local-docker-directory
      - name: Build AMD Image for production or main
        if: env.RELEASE_VERSION == 'production' || env.RELEASE_VERSION == 'latest' || env.RELEASE_VERSION == 'staging' || startsWith(env.RELEASE_VERSION, 'dev') || startsWith(env.RELEASE_VERSION, 'pr-')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -n "${{ env.ECR_APP_REPO }}" ]; then
            ECR_APP_BASE="$ECR_REGISTRY/${{ env.ECR_APP_REPO }}"
            ECR_FRONTEND_BASE="$ECR_REGISTRY/${{ env.ECR_FRONTEND_REPO }}"
            ECR_APP_TAGS=(
              --tag "$ECR_APP_BASE:latest"
              --tag "$ECR_APP_BASE:$ECR_SHA_TAG"
              --tag "$ECR_APP_BASE:$ECR_BUILD_TAG"
            )
            ECR_FRONTEND_TAGS=(
              --tag "$ECR_FRONTEND_BASE:latest"
              --tag "$ECR_FRONTEND_BASE:$ECR_SHA_TAG"
              --tag "$ECR_FRONTEND_BASE:$ECR_BUILD_TAG"
            )
          else
            ECR_APP_TAGS=()
            ECR_FRONTEND_TAGS=()
          fi
          docker build . --file Dockerfile --platform=linux/amd64 --progress=plain \
            --tag $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME:$RELEASE_VERSION \
            --tag $GITHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME:$RELEASE_VERSION \
            "${ECR_APP_TAGS[@]}"
          docker build ./docker/nginx_production/ --platform=linux/amd64 --progress=plain \
            --tag $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME-frontend:$RELEASE_VERSION \
            --tag $GITHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME-frontend:$RELEASE_VERSION \
            "${ECR_FRONTEND_TAGS[@]}"
          docker image ls
      - name: Push Image to Docker Hub
        if: env.RELEASE_VERSION == 'production' || env.RELEASE_VERSION == 'latest' || env.RELEASE_VERSION == 'staging' || startsWith(env.RELEASE_VERSION, 'dev')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME --all-tags
          docker push $DOCKERHUB_REGISTRY/$DOCKERHUB_USERNAME/$IMAGE_NAME-frontend --all-tags
      - name: Show PR Build Results
        if: startsWith(env.RELEASE_VERSION, 'pr-')
        run: |
          echo "PR build completed successfully!"
          echo "Built images:"
          docker images | grep "$IMAGE_NAME" || echo "No images found"
          echo "PR images are not pushed to registries to save storage costs"
      - name: Push production or staging image to Amazon ECR
        if: env.RELEASE_VERSION == 'production' || env.RELEASE_VERSION == 'staging'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_APP_REPO: ${{ env.ECR_APP_REPO }}
          ECR_FRONTEND_REPO: ${{ env.ECR_FRONTEND_REPO }}
        run: |
          set -euo pipefail
          for tag in latest "$ECR_SHA_TAG" "$ECR_BUILD_TAG"; do
            docker push "$ECR_REGISTRY/$ECR_APP_REPO:$tag"
            docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPO:$tag"
          done
      # Bounce the service onto the newest ACTIVE revision of the task-definition
      # family (images still :latest). Does not register a new revision / PassRole.
      - name: Force ECS redeployment (staging)
        if: env.RELEASE_VERSION == 'staging'
        run: |
          set -euo pipefail
          CLUSTER="kcworks-staging-3"
          SERVICE="kcworks-staging-blue"
          TASK_FAMILY="kcworks-staging"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Forcing new deployment on cluster=${CLUSTER} service=${SERVICE} taskDefinition=${TASK_DEF}"
          echo "### ECS redeploy (staging)" >> "$GITHUB_STEP_SUMMARY"
          echo "- cluster: \`${CLUSTER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- service: \`${SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- taskDefinition: \`${TASK_DEF}\`" >> "$GITHUB_STEP_SUMMARY"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEF" \
            --force-new-deployment \
            --output text \
            --query 'service.serviceName'
          echo "Waiting for service to become stable..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Service ${SERVICE} is stable on ${TASK_DEF}"
      # Sentry release (staging) — re-enable when GitHub secrets are configured:
      # SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT_STAGING
      # - name: Create Sentry release (staging)
      #   if: env.RELEASE_VERSION == 'staging'
      #   uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #     SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_STAGING }}
      #   with:
      #     environment: staging
      #     version: ${{ env.SENTRY_RELEASE }}
      #     ignore_missing: true
      - name: Force ECS redeployment (production)
        if: env.RELEASE_VERSION == 'production'
        run: |
          set -euo pipefail
          CLUSTER="kcworks-prod-2"
          TASK_FAMILY="kcworks"
          SERVICES_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services kcworks-blue kcworks-green \
            --output json)
          BLUE_DESIRED=$(echo "$SERVICES_JSON" | jq -r '.services[] | select(.serviceName=="kcworks-blue") | .desiredCount // 0')
          GREEN_DESIRED=$(echo "$SERVICES_JSON" | jq -r '.services[] | select(.serviceName=="kcworks-green") | .desiredCount // 0')
          BLUE_RUNNING=$(echo "$SERVICES_JSON" | jq -r '.services[] | select(.serviceName=="kcworks-blue") | .runningCount // 0')
          GREEN_RUNNING=$(echo "$SERVICES_JSON" | jq -r '.services[] | select(.serviceName=="kcworks-green") | .runningCount // 0')
          echo "kcworks-blue desired=${BLUE_DESIRED} running=${BLUE_RUNNING}"
          echo "kcworks-green desired=${GREEN_DESIRED} running=${GREEN_RUNNING}"
          if { [ "${BLUE_DESIRED}" -gt 0 ] || [ "${BLUE_RUNNING}" -gt 0 ]; } && \
             { [ "${GREEN_DESIRED}" -gt 0 ] || [ "${GREEN_RUNNING}" -gt 0 ]; }; then
            SERVICE="kcworks-blue"
            echo "Both colors up; preferring kcworks-blue for blue-green pretest"
          elif [ "${BLUE_DESIRED}" -gt 0 ] || [ "${BLUE_RUNNING}" -gt 0 ]; then
            SERVICE="kcworks-blue"
          elif [ "${GREEN_DESIRED}" -gt 0 ] || [ "${GREEN_RUNNING}" -gt 0 ]; then
            SERVICE="kcworks-green"
          else
            echo "Neither kcworks-blue nor kcworks-green has desired/running tasks" >&2
            exit 1
          fi
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Forcing new deployment on cluster=${CLUSTER} service=${SERVICE} taskDefinition=${TASK_DEF}"
          echo "### ECS redeploy (production)" >> "$GITHUB_STEP_SUMMARY"
          echo "- cluster: \`${CLUSTER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- service: \`${SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- taskDefinition: \`${TASK_DEF}\`" >> "$GITHUB_STEP_SUMMARY"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEF" \
            --force-new-deployment \
            --output text \
            --query 'service.serviceName'
          echo "Waiting for service to become stable..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Service ${SERVICE} is stable on ${TASK_DEF}"
      # Sentry release (production) — re-enable when GitHub secrets are configured:
      # SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
      # (org slug mesh-research; project id 4509254001295360 from Sentry URL)
      # - name: Create Sentry release (production)
      #   if: env.RELEASE_VERSION == 'production'
      #   uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #     SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      #   with:
      #     environment: production
      #     version: ${{ env.SENTRY_RELEASE }}
      #     ignore_missing: true
      - name: Start containers
        if: always()
        env:
          CILOGON_CLIENT_ID: ${{ secrets.CILOGON_CLIENT_ID }}
          CILOGON_CLIENT_SECRET: ${{ secrets.CILOGON_CLIENT_SECRET }}
          INVENIO_RECORD_IMPORTER_LOCAL_DATA_DIR: /tmp/import_data
          INVENIO_RECORD_IMPORTER_DATA_DIR: ${{ vars.INVENIO_RECORD_IMPORTER_DATA_DIR }}
          INVENIO_SEARCH_DOMAIN: ${{ vars.INVENIO_SEARCH_DOMAIN }}
          INVENIO_INSTANCE_PATH: ${{ vars.INVENIO_INSTANCE_PATH }}
          INVENIO_SECRET_KEY: ${{ secrets.INVENIO_SECRET_KEY }}
          INVENIO_SQLALCHEMY_DATABASE_URI: ${{ vars.INVENIO_SQLALCHEMY_DATABASE_URI }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          REDIS_DOMAIN: ${{ vars.REDIS_DOMAIN }}
        run: |
          touch tests/.env
          touch .env
          install -m 600 /dev/null /tmp/kcworks-runtime-secrets.env
          # Seed static_data from the kcworks image with a single first mount.
          # Parallel create of ui/api/worker/frontend on an empty named volume
          # races Docker copy-up (mkdir …/js/pdfjs/cmaps: file exists).
          docker compose --file docker-compose.yml up -d web-ui
          docker compose --file docker-compose.yml up -d
      - name: Destroy containers
        if: always()
        run: |
          touch .env
          install -m 600 /dev/null /tmp/kcworks-runtime-secrets.env
          docker compose --file docker-compose.yml down
      - name: Prune Docker
        run: docker system prune -af
