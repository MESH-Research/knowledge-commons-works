name: Tests
on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxslt1-dev
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install python dependencies
        run: |
          uv sync --frozen --all-extras
          export CFLAGS="-Wno-error=incompatible-pointer-types"
          uv pip install --reinstall --no-binary=lxml "lxml==5.2.1"
      - name: set up docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      # pnpm must be on PATH before setup-node cache: pnpm (it runs `pnpm store path`).
      # Pin must match root package.json packageManager (action-setup errors on mismatch).
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
          run_install: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Create config files
        run: |
          echo "[cli]" >> .invenio.private && \
          echo "services_setup=False" >> .invenio.private && \
          echo "instance_path=/opt/invenio/var/instance" >> .invenio.private
          touch tests/.env
      # Before pytest: geopattern parity helpers (dump_js.js) need root node_modules.
      # Same install also covers lint + Jest below.
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        env:
          # Mail SPARKPOST_* / INVENIO_ADMIN_EMAIL are placeholders from
          # run-tests.sh by default (suite suppresses SMTP). Opt in locally
          # with --fetch-secrets. Other secrets below are for live/remote tests.
          CILOGON_CLIENT_ID: ${{ secrets.CILOGON_CLIENT_ID }}
          CILOGON_CLIENT_SECRET: ${{ secrets.CILOGON_CLIENT_SECRET }}
          COMMONS_PROFILES_API_TOKEN: ${{ secrets.TEST_COMMONS_PROFILES_API_TOKEN }}
          # Do not inject vars.INVENIO_SITE_UI_URL: tests/fixtures/urls.py
          # defaults to http://localhost. A https repo var mismatches Flask
          # test-client request.url (always http) used as silent-SSO
          # final_redirect, without reflecting real TLS termination.
          INVENIO_SITE_API_URL: ${{ vars.INVENIO_SITE_API_URL }}
          INVENIO_COMMONS_API_REQUEST_PROTOCOL: https
          INVENIO_MAIL_SUPPRESS_SEND: True
          PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::PendingDeprecationWarning,ignore::UserWarning"
        run: |
          chmod +x run-tests.sh
          bash run-tests.sh
      # - name: Run translations test
      #   run: ./run-i18n-tests.sh
      - name: Lint JavaScript
        working-directory: .
        run: pnpm run lint
      # - name: Install deps for frontend tests - translations
      #   working-directory: ./translations/kcworks
      #   run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: .
        run: |-
          chmod +x run-js-tests.sh
          bash run-js-tests.sh
