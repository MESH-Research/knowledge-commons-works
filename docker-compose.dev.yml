# Local development stack for Knowledge Commons Works
# including bind mounts for local copies of installed python files
#
# Usage::
#
#   $ ./kcworks-startup.sh
#
# Or manually (host port defaults in docker-compose.dev.env; .env overrides):
#
#   $ docker compose --env-file docker-compose.dev.env --env-file .env \
#       --file docker-compose.yml --file docker-compose.dev.yml up -d
#
# Extends the web-ui, web-api, and worker services to include bind mounts for
# shared persistent volumes to hold app code and data. Adds an additional 
# dev-workspace service to serve as the editing and execution environment for
# the project.
#
x-app-volumes: &app-volumes
  - src_data:/opt/invenio/src
  - instance_data:/opt/invenio/var/instance
  - import_data:/opt/invenio/var/import_data
  - static_data:/opt/invenio/var/instance/static
x-app-environment: &app-environment
  - INVENIO_LOGGING_CONSOLE_LEVEL=DEBUG
  - INVENIO_MAIL_SUPPRESS_SEND=True
services:
  dev-workspace:
    extends:
      file: docker-services.yml
      service: dev-workspace
    image: monotasker/kcworks-workspace:${IMAGE_TAG:-latest}
    build:
      context: .
      target: dev-workspace
    volumes: *app-volumes
    environment: *app-environment
  web-ui:
    extends:
      file: docker-compose.yml
      service: web-ui
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment: *app-environment
    volumes: *app-volumes
  web-api:
    extends:
      file: docker-compose.yml
      service: web-api
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    # build same was web-ui
    environment: *app-environment
    volumes: *app-volumes
  worker:
    extends:
      file: docker-compose.yml
      service: worker
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    # build same was web-ui
    environment: *app-environment
    volumes: *app-volumes
  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    # build same was web-ui
    environment: *app-environment
    volumes: *app-volumes
  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    volumes:
      - static_data:/opt/invenio/var/instance/static
volumes:
  # static_data defined in main docker-compose.yml
  instance_data:
  src_data:
