# Local development stack for Knowledge Commons Works
# including bind mounts for local copies of installed python files
#
# Usage::
#
#   $ ./kcworks-startup.sh
#
# Or manually (host port defaults in docker-compose.dev.env; .env overrides):
#
#   $ docker compose --env-file docker-compose.dev.env --env-file .env \
#       --file docker-compose.yml --file docker-compose.dev.yml up -d
#
# Extends the web-ui, web-api, and worker services to include bind mounts for
# shared persistent volumes to hold app code and data. Adds an additional 
# dev-workspace service to serve as the editing and execution environment for
# the project.
#
services:
  dev-workspace:
    extends:
      file: docker-compose.yml
      service: dev-workspace
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: dev-workspace
  web-ui:
    extends:
      file: docker-compose.yml
      service: web-ui
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      - INVENIO_LOGGING_CONSOLE_LEVEL=DEBUG
      - INVENIO_MAIL_SUPPRESS_SEND=True
    volumes:
      # - ./invenio.cfg:/opt/invenio/var/instance/invenio.cfg
      - src_data:/src
      - assets_data:/assets
      - translations_data:/translations
      - ./src/app_data:/opt/invenio/var/instance/app_data
      - static_data:/opt/invenio/var/instance/static
      - template_data:/opt/invenio/var/instance/templates
      - archived_data:/opt/invenio/var/instance/archive
      - uploaded_data:/opt/invenio/var/instance/data
      - import_data:/opt/invenio/var/import_data}
  web-api:
    extends:
      file: docker-compose.yml
      service: web-api
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      - INVENIO_LOGGING_CONSOLE_LEVEL=DEBUG
      - INVENIO_MAIL_SUPPRESS_SEND=True
    volumes:
      - src_data:/src
      - assets_data:/assets
      - translations_data:/translations
      - ./src/app_data:/opt/invenio/var/instance/app_data
      - static_data:/opt/invenio/var/instance/static
      - template_data:/opt/invenio/var/instance/templates
      - archived_data:/opt/invenio/var/instance/archive
      - uploaded_data:/opt/invenio/var/instance/data
      - import_data:/opt/invenio/var/import_data}
  worker:
    extends:
      file: docker-compose.yml
      service: worker
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      - INVENIO_LOGGING_CONSOLE_LEVEL=DEBUG
      - INVENIO_MAIL_SUPPRESS_SEND=True
    volumes:
      - src_data:/src
      - assets_data:/assets
      - translations_data:/translations
      - ./src/app_data:/opt/invenio/var/instance/app_data
      - static_data:/opt/invenio/var/instance/static
      - template_data:/opt/invenio/var/instance/templates
      - archived_data:/opt/invenio/var/instance/archive
      - uploaded_data:/opt/invenio/var/instance/data
      - import_data:/opt/invenio/var/import_data}
  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    image: monotasker/kcworks-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      - INVENIO_LOGGING_CONSOLE_LEVEL=DEBUG
      - INVENIO_MAIL_SUPPRESS_SEND=True
    volumes:
      # - ./invenio.cfg:/opt/invenio/var/instance/invenio.cfg
      - src_data:/src
      - assets_data:/assets
      - translations_data:/translations
      - app_data:/opt/invenio/var/instance/app_data
      - static_data:/opt/invenio/var/instance/static
volumes:
  import_data:
  template_data:
  src_data:
  assets_data:
  translations_data:
